# Edge reverse proxy for the hardened lab target.
#
# The secure app runs on an internal network only (gunicorn, no host port);
# nginx is the sole host-exposed service. Two listeners:
#   :80  (published as :8080) -- Option A: same edge headers, no forced HTTPS
#         redirect, so `run_headers --url http://localhost:8080/` measures the
#         edge with zero tool changes.
#   :443 (published as :8443) -- real TLS (self-signed lab cert) for a
#         `curl -k` / browser demo.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Do not advertise the nginx version in responses or error pages.
    server_tokens off;

    # Bound request body size (defensive default; the app has no large uploads).
    client_max_body_size 1m;

    # Per-client rate limit for the login path (brute-force friction). Pairs
    # with the app's flask-limiter budget -- defense in depth.
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

    # Internal upstream: the gunicorn container on the isolated network.
    upstream secure_app {
        server secure-app:5000;
    }

    # ---- HTTP :80 (published :8080) -- tool-measurable edge -------------------
    server {
        listen 80;
        server_name localhost;

        # Lightweight liveness endpoint for the container healthcheck; does not
        # touch the upstream so nginx health is independent of the app.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location = /login {
            limit_req zone=login burst=5 nodelay;
            include /etc/nginx/app_proxy.conf;
        }

        location / {
            include /etc/nginx/app_proxy.conf;
        }
    }

    # ---- HTTPS :443 (published :8443) -- TLS demo ----------------------------
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/lab.crt;
        ssl_certificate_key /etc/nginx/certs/lab.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location = /login {
            limit_req zone=login burst=5 nodelay;
            include /etc/nginx/app_proxy.conf;
        }

        location / {
            include /etc/nginx/app_proxy.conf;
        }
    }
}
