# Serves the built SPA and reverse-proxies API paths to the internal
# portal-api, so the browser talks to a single same-origin host (no CORS) and
# the API stays off the host network. API responses (incl. the 9 security
# headers) pass through unchanged, so `run_headers --url .../health` scores 9/9.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location = /health { proxy_pass http://portal-api:8000; }
    location /auth     { proxy_pass http://portal-api:8000; }
    location = /me     { proxy_pass http://portal-api:8000; }
    location /api      { proxy_pass http://portal-api:8000; }

    # SPA client-side routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
