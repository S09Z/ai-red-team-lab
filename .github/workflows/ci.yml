name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Concrete deps only. The observation library imports requests + bs4;
          # the hardened target ships its own requirements (needed because the
          # secure-app tests drive create_app()). `headroom` is declared in
          # pyproject but never imported, so it is intentionally skipped.
          pip install ruff pytest responses requests beautifulsoup4
          pip install -r targets/flask-app-secure/requirements.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -ra

  portal-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff -r portal-api/requirements.txt

      - name: Lint
        run: ruff check portal-api

      - name: Test
        env:
          AUTH_STUB: "1"
        run: pytest portal-api/tests -ra

  portal-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
