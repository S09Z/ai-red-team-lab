{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<h1>Login</h1>
{% if error %}<p style="color:red">{{ error }}</p>{% endif %}
<form method="post">
  <label>Username<br><input name="username" type="text" autocomplete="off"></label><br><br>
  <label>Password<br><input name="password" type="password"></label><br><br>
  <button type="submit">Login</button>
</form>
<p><small>Hint: try <code>admin'--</code> as the username with any password.</small></p>
{% endblock %}
